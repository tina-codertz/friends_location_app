<script>
        const sosTrigger = document.getElementById('sos-trigger');
        const progressCircle = document.getElementById('progress-circle');
        const sosLabel = document.getElementById('sos-label');
        const countdownText = document.getElementById('countdown-text');
        
        let timer;
        let progress = 0;
        const duration = 5000; // 5 seconds
        const circleLength = 691; // 2 * PI * 110

        function startTimer() {
            sosLabel.classList.add('hidden');
            countdownText.classList.remove('hidden');
            progress = 0;
            
            const start = Date.now();
            
            timer = setInterval(() => {
                const elapsed = Date.now() - start;
                progress = Math.min(elapsed / duration, 1);
                
                // Update SVG progress
                const offset = circleLength - (progress * circleLength);
                progressCircle.style.strokeDashoffset = offset;
                
                // Update Countdown Number
                const remaining = Math.ceil(5 - (progress * 5));
                countdownText.textContent = remaining;

                if (progress >= 1) {
                    clearInterval(timer);
                    triggerSOS();
                }
            }, 16);
        }

        function stopTimer() {
            clearInterval(timer);
            progress = 0;
            progressCircle.style.strokeDashoffset = circleLength;
            sosLabel.classList.remove('hidden');
            countdownText.classList.add('hidden');
            countdownText.textContent = '5';
        }

        function triggerSOS() {
            // High urgency haptic simulation / UI state change
            document.body.style.backgroundColor = '#690005';
            sosTrigger.innerHTML = '<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
            sosTrigger.classList.remove('sos-pulse');
            sosTrigger.style.boxShadow = '0 0 100px #ffb4ab';
            sosLabel.textContent = 'ALERTS SENT';
            sosLabel.classList.remove('hidden');
            countdownText.classList.add('hidden');
            
            setTimeout(() => {
                alert('Emergency alerts have been broadcast to your contacts and emergency services.');
            }, 500);
        }

        // Support for both mouse and touch
        sosTrigger.addEventListener('mousedown', startTimer);
        sosTrigger.addEventListener('mouseup', stopTimer);
        sosTrigger.addEventListener('mouseleave', stopTimer);
        
        sosTrigger.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startTimer();
        });
        sosTrigger.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopTimer();
        });

        // Prevention of context menu on long press
        window.oncontextmenu = function(event) {
            event.preventDefault();
            event.stopPropagation();
            return false;
        };
    </script>
