<script>
        // Micro-interactions for scrolling effects
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('bg-surface/90');
            } else {
                header.classList.remove('bg-surface/90');
            }
        });

        // Simple haptic-like scale effect on all buttons
        document.querySelectorAll('button, .glass-panel').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.style.transform = 'scale(0.98)';
            });
            el.addEventListener('touchend', () => {
                el.style.transform = 'scale(1)';
            });
        });
    </script>
