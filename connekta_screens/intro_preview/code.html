<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neon-glow-primary {
            box-shadow: 0 0 20px rgba(236, 178, 255, 0.5);
        }
        .glass-panel {
            background: rgba(31, 31, 34, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(236, 178, 255, 0.6);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .gradient-text {
            background: linear-gradient(to right, #ecb2ff, #00dbe9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-neon-gradient {
            background: linear-gradient(135deg, #bd00ff 0%, #00eefc 100%);
        }
    </style>

<body class="bg-background text-on-background min-h-screen overflow-hidden select-none">

<div class="absolute bottom-1/3 right-1/4 w-48 h-48 rounded-full border border-secondary/20 animate-pulse-ring z-10" style="animation-delay: 1s;"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-20 flex flex-col items-center justify-center min-h-screen px-edge-margin text-center">
<!-- Hero Section -->
<div class="space-y-sm flex flex-col items-center mb-xl">
<!-- Animated Wordmark -->
<h1 class="font-display-xl text-display-xl md:text-[64px] tracking-tight text-white mb-xs animate-fade-in">
<span class="text-glow">Pulse</span><span class="gradient-text">Map</span>
</h1>
<!-- Value Prop -->

                Map your world. <span class="text-primary font-semibold">Pulse</span> with your squad.
            </p>
</div>
<!-- Interactive Map Preview Chips (Bento-style layout for mobile vibe) -->
<div class="grid grid-cols-2 gap-sm mb-xl w-full max-w-sm">
<div class="glass-panel p-sm rounded-xl flex items-center gap-xs">

<span class="font-label-md text-label-md text-on-surface">Live Now</span>
</div>
<div class="glass-panel p-sm rounded-xl flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[18px]">group</span>
<span class="font-label-md text-label-md text-on-surface">12 Friends</span>
</div>
</div>
<!-- Call to Action Section -->
<div class="w-full max-w-xs space-y-md">
<button class="w-full bg-neon-gradient text-on-primary-container font-headline-md text-headline-md py-md rounded-xl neon-glow-primary active:scale-95 transition-transform duration-200" onclick="handleStart()">
                Get Started
            </button>
<a class="block font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors py-sm" href="#">
                Already have an account? <span class="text-primary underline underline-offset-4">Sign In</span>
</a>
</div>
<!-- Security/Trust Badging (Subtle) -->
<div class="absolute bottom-xl flex items-center gap-xs opacity-50">
<span class="material-symbols-outlined text-sm">security</span>
<span class="font-label-sm text-label-sm">End-to-End Privacy Encrypted</span>
</div>
</main>

<script>
        // Simple Interaction logic
        function handleStart() {
            // Visual feedback for interaction
            const btn = document.querySelector('button');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            
            setTimeout(() => {
                alert('Welcome to the Pulse! Redirecting to map view...');
                btn.innerHTML = 'Get Started';
            }, 800);
        }

        // Add subtle mouse move effect to background
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const bg = document.querySelector('img[data-alt]');
            bg.style.transform = `scale(1.05) translate(${(x - 0.5) * 20}px, ${(y - 0.5) * 20}px)`;
        });

        // Initialize Material Symbols settings
        window.addEventListener('DOMContentLoaded', () => {
            // Any specific icon weight logic here
        });
    </script>
