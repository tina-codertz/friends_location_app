<style>

        }

        .neon-glow-purple {
            box-shadow: 0 0 20px rgba(189, 0, 255, 0.4);
        }
        .map-bg {
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) saturate(1.2);
        }
        .input-gradient-border {
            background: linear-gradient(to right, transparent, transparent) padding-box,
                        linear-gradient(to right, #ecb2ff, #00dbe9) border-box;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .map-marker-pulse {
            animation: pulse-ring 3s infinite ease-in-out;

<!-- Top Navigation (Shell Implementation - Suppressed for Login but keeping Brand identity) -->

<div class="glass-panel w-full max-w-md rounded-xl p-lg flex flex-col gap-lg shadow-2xl transform transition-all hover:scale-[1.01]">

</div>
<div class="space-y-base">

</button>

<span class="material-symbols-outlined text-body-lg">ios</span>

<!-- Visual Embellishment: Background Blurs -->
<div class="fixed top-1/4 -left-20 w-80 h-80 bg-primary/20 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-20 w-80 h-80 bg-secondary-fixed-dim/10 blur-[100px] rounded-full pointer-events-none"></div>
<script>
        // Simple micro-interaction for input glow enhancement
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.02]');
                input.parentElement.parentElement.style.transition = 'all 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.02]');
            });
        });

        // Background parallax effect
        document.addEventListener('mousemove', (e) => {
            const map = document.querySelector('.map-bg');
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            map.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
        });
    </script>
